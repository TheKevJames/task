[project]
name = "task"
version = "10.0.1"
description = "Simple personal task manager"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [{ name = "Kevin James", email = "KevinJames@thekev.in" }]

dependencies = [
    "pydantic==2.14.2",
    "typer==0.27.3",
]

[project.urls]
repository = "https://github.com/TheKevJames/task"

[project.scripts]
task = "task.cli:cli"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.5.0",
    "hypothesis==6.170.11",
    "pylint==4.1.3",
    "pytest-xdist==3.8.0",
    "pytest==9.2.0",
    "time-machine==3.6.0",
]

[tool.pytest]
addopts = ["-n", "auto"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
