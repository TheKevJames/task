name: ci

on: [pull_request, push]

jobs:
  lint:
    if: &not-fork github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.6
          # renovate: datasource=docker depName=python
          python-version: 3.15.1
      - uses: j178/prek-action@v3.1.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.7
          extra-args: --all-files

  test:
    if: *not-fork
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.6
      - run: uv run --frozen pytest

  # Merging a version change is the release: this pushes its tag, with the
  # `tag` environment's deploy key (see TheKevJames/tools _tag.yml).
  tag:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: TheKevJames/tools/.github/workflows/_tag.yml@master
    with:
      version-command: uv version --short
    secrets:
      TAG_DEPLOY_KEY: ${{ secrets.TAG_DEPLOY_KEY }}

  github-release:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: TheKevJames/tools/.github/workflows/_github-release.yml@master
